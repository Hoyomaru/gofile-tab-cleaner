<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Gofile Tab Cleaner</h1>
  </header>

  <section class="stats" aria-label="現在のタブ状況">
    <div class="stat"><span class="num" id="statTotal">–</span><span class="lbl">Gofile タブ</span></div>
    <div class="stat"><span class="num" id="statDup">–</span><span class="lbl">重複</span></div>
    <div class="stat"><span class="num" id="statSleep">–</span><span class="lbl">未読み込み</span></div>
  </section>

  <section class="card">
    <label class="row">
      <span class="text">
        <span class="title">不存在タブを自動で閉じる</span>
        <span class="desc">「This content does not exist」表示を検出したら閉じます</span>
      </span>
      <input type="checkbox" class="switch" id="autoNotFound">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">重複タブを自動で閉じる</span>
        <span class="desc">最初に開いたタブを残します（全ウィンドウ対象）</span>
      </span>
      <input type="checkbox" class="switch" id="autoDedupe">
    </label>
  </section>

  <section class="scan">
    <button id="scan" class="primary">今すぐ全タブを整理</button>
    <div id="progress" class="progress" hidden>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div id="result" class="result"></div>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>最近閉じたタブ</h2>
      <div class="actions">
        <button id="reopenAll" class="ghost" title="表示中の履歴をすべて開き直す">すべて開く</button>
        <button id="clear" class="ghost" title="履歴を消去">クリア</button>
      </div>
    </div>
    <div class="filters" role="tablist">
      <button class="chip active" data-filter="all">すべて <span id="cntAll"></span></button>
      <button class="chip" data-filter="notFound">不存在 <span id="cntNotFound"></span></button>
      <button class="chip" data-filter="duplicate">重複 <span id="cntDuplicate"></span></button>
    </div>
    <ul id="log"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
